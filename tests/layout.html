<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheet layout checks</title>
<style>
  body { margin: 16px; font: 16px system-ui; background: #eee; color: #222; }
  label { display: inline-block; margin: 0 12px 12px 0; }
  input, select, button { font: inherit; padding: 6px; }
  #source { width: min(65vw, 800px); }
  iframe { display: block; border: 1px solid #777; background: white; height: 950px; }
  .frame-scroll { overflow: auto; }
</style>
<h1>Sheet layout checks</h1>
<p>Development test harness. Width presets change the embedded page's real viewport.
  Print styles preview checks layout only; use the sheet directly for browser print pagination.</p>
<label>Sheet URL <input id="source" value="../index.html"></label>
<button id="load" type="button">Load sheet</button><br>
<label>Viewport <select id="width">
  <option value="320">320 px phone</option>
  <option value="390" selected>390 px phone</option>
  <option value="640">640 px tablet</option>
  <option value="1024">1024 px desktop</option>
  <option value="1440">1440 px desktop</option>
  <option value="703">A4 printable width (12 mm margins)</option>
</select></label>
<label><input type="checkbox" id="print"> Preview print styles (no pagination)</label>
<p id="status" role="status"></p>
<div class="frame-scroll"><iframe id="sheet" title="Character sheet preview" style="width:390px"></iframe></div>
<script>
  const frame = document.querySelector('#sheet');
  const print = document.querySelector('#print');
  let printStyle;
  function showPrintStyles() {
    try {
      if (printStyle) printStyle.remove();
      printStyle = null;
      if (print.checked) {
        const doc = frame.contentDocument;
        const rules = [];
        for (const sheet of doc.styleSheets) {
          let list;
          try { list = sheet.cssRules; } catch { continue; }
          for (const rule of list) {
            if (rule.type === CSSRule.MEDIA_RULE && rule.conditionText === 'print') {
              rules.push(...Array.from(rule.cssRules, item => item.cssText));
            }
          }
        }
        printStyle = doc.createElement('style');
        printStyle.textContent = rules.join('\n');
        doc.head.append(printStyle);
        document.querySelector('#status').textContent = 'Print CSS preview. Use the sheet Print button to choose the current section or complete crawler.';
      } else {
        frame.contentWindow.dispatchEvent(new frame.contentWindow.Event('afterprint'));
        document.querySelector('#status').textContent = 'Screen layout. Browser printing is stubbed only inside this test frame.';
      }
    } catch {
      document.querySelector('#status').textContent = 'Print CSS preview requires the sheet and this harness on the same origin. Width checks still work.';
    }
  }
  document.querySelector('#width').addEventListener('change', event => { frame.style.width = event.target.value + 'px'; });
  document.querySelector('#load').addEventListener('click', () => { frame.src = document.querySelector('#source').value; });
  print.addEventListener('change', showPrintStyles);
  frame.addEventListener('load', () => {
    try { frame.contentWindow.print = () => {}; } catch {}
    showPrintStyles();
  });
</script>
</html>
